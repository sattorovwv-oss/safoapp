name: safo
description: "Сафо — тозагии маҳаллаҳо ва сайёҳии Тоҷикистон."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface: ^4.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#15803D"
  adaptive_icon_foreground: assets/icon_fg.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/hero.jpg
    - assets/icon.png
